<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Test Report — MENTORA LMG Service</title>
<style>
:root{
  --ink:#16233b; --muted:#5b6b85; --line:#e3e9f2;
  --bg:#f4f6fb; --panel:#ffffff;
  --navy:#0f2a52; --navy2:#1d3a6e;
  --blue:#2563eb; --teal:#0d9488;
  --green:#16a34a; --green-bg:#eaf7ef; --green-bd:#b8e6c9;
  --red:#dc2626; --red-bg:#fdecec; --red-bd:#f5c2c2;
  --amber:#d97706; --amber-bg:#fdf3e3; --amber-bd:#f3d9a8;
  --gray:#6b7280; --gray-bg:#f0f2f5; --gray-bd:#d6dae1;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.55;font-size:14.5px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 70px}

/* header band */
.band{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 70%,#2a5a9e 100%);
  color:#fff;padding:30px 0 0;}
.band .wrap{padding-bottom:26px}
.kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.7;font-weight:600}
h1.doctitle{font-size:27px;margin:6px 0 2px;font-weight:800}
.docmeta{font-size:13px;opacity:.85}
.docmeta span{margin-right:20px;display:inline-block}
.statusrow{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px}
.pill-pass{background:#0e2b18;color:#5ee08a;border:1px solid #2c6b41}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#2fd575;box-shadow:0 0 0 4px rgba(47,213,117,.18)}
.docid{font-variant-numeric:tabular-nums}

/* sticky nav */
nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;align-items:center;padding-top:0;padding-bottom:0;overflow-x:auto}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;padding:13px 12px;white-space:nowrap;
  border-bottom:3px solid transparent}
nav a:hover{color:var(--navy)}
nav a.on{border-bottom-color:var(--blue);color:var(--navy)}

/* section */
section{padding:34px 0 6px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.sec-num{background:var(--navy);color:#fff;width:30px;height:30px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.sec-title{font-size:20px;font-weight:800;margin:0}
.sec-sub{color:var(--muted);font-size:13.5px;margin:2px 0 18px 42px}
h3{font-size:15px;font-weight:700;margin:22px 0 8px}

/* verdict banner */
.verdict{display:flex;gap:26px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:24px;flex-wrap:wrap;box-shadow:0 6px 24px rgba(15,42,82,.06)}
.pass-ring{position:relative;width:130px;height:130px;flex:none}
.pass-ring svg{transform:rotate(-90deg)}
.pass-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pass-ring .c .p{font-size:30px;font-weight:800;color:var(--green);line-height:1}
.pass-ring .c .l{font-size:11px;color:var(--muted);margin-top:2px}
.vtext{flex:1;min-width:220px}
.vtext .t{font-size:19px;font-weight:800;color:var(--green)}
.vtext .s{color:var(--muted);font-size:13.5px;margin-top:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;flex:2;min-width:320px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center}
.kpi .n{font-size:24px;font-weight:800;line-height:1}
.kpi .l{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
.kpi.g .n{color:var(--green)} .kpi.r .n{color:var(--red)} .kpi.b .n{color:var(--blue)} .kpi.y .n{color:var(--amber)}

/* cards grid */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card .ic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.card .t{font-weight:700;font-size:15px}
.card .d{color:var(--muted);font-size:13px;margin-top:4px}

/* two col */
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start}
@media(max-width:820px){.cols{grid-template-columns:1fr}}

/* tables */
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:#eef2f9;color:var(--navy);font-size:12px;text-transform:uppercase;letter-spacing:.5px;
  text-align:left;padding:11px 14px;font-weight:700;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
tr:last-child td{border-bottom:none}
td code{background:#eef1f7;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.b-open-l{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-bd)}
.b-open-m{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bd)}
.b-pass{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.b-info{background:var(--gray-bg);color:var(--gray);border:1px solid var(--gray-bd)}
.b-fix{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.b-fail{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}

/* result bars by module */
.filerow{display:flex;flex-wrap:wrap;gap:12px}
.fcard{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px 16px;flex:1;min-width:300px}
.fcard .head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fcard .name{font-weight:700;font-size:13.5px;flex:1;word-break:break-word}
.fcard .layer{font-size:10.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.4px;
  border:1px solid rgba(37,99,235,.25);background:rgba(37,99,235,.06);padding:2px 8px;border-radius:999px;white-space:nowrap}
.bar{height:9px;background:#e8edf5;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>div{height:100%;background:linear-gradient(90deg,var(--green),#4ade80);border-radius:99px}
.fcount{font-size:12.5px;color:var(--muted);margin-top:6px}
.fcount b{color:var(--ink)}

/* coverage list */
.covitem{display:flex;align-items:center;gap:14px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.covitem:last-child{border-bottom:none}
.covlabel{flex:1}.covlabel b{display:block;font-size:13.5px}.covlabel span{color:var(--muted);font-size:12.5px}
.covnum{width:56px;text-align:right;font-weight:700;color:var(--navy)}

/* search */
.searchbar{display:flex;gap:10px;align-items:center;margin:14px 0}
.searchbar input{flex:1;min-width:200px;border:1px solid var(--line);background:#fff;padding:10px 14px;
  border-radius:10px;font-size:14px;outline:none}
.searchbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--muted);padding:6px 12px;
  border-radius:999px;font-size:12.5px;user-select:none;transition:.15s}
.chip:hover{color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

/* results matrix (collapsible files) */
.file{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
.fhead{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
.fhead:hover{background:#f8fafd}
.fname{font-weight:650;flex:1;font-size:13.5px}
.flayer{font-size:10.5px;color:var(--teal);border:1px solid rgba(13,148,136,.3);background:rgba(13,148,136,.07);
  padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.mbar{width:120px;height:8px;background:#e8edf5;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.mbar>div{height:100%;background:linear-gradient(90deg,var(--green),#4ade80)}
.fcount{font-size:12.5px;color:var(--muted);width:88px;text-align:right;font-variant-numeric:tabular-nums}
.chev{color:#9aa7bd;transition:.2s;font-size:12px}
.file.open .chev{transform:rotate(90deg)}
.tests{display:none;border-top:1px solid var(--line);padding:8px 12px 12px;background:#fcfdff}
.file.open .tests{display:block}
.tst{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:13px}
.tst:hover{background:#f4f7fc}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.dot.pass{background:var(--green)}
.dot.fail{background:var(--red)}
.empty{text-align:center;color:var(--muted);padding:36px 0;font-size:14px}

/* print */
@media print{
  body{background:#fff}
  nav{display:none}
  .band{background:var(--navy);-webkit-print-color-adjust:exact}
  section{break-inside:avoid-page}
  .file,.verdict,.card,table{-webkit-print-color-adjust:exact}
  .fhead{cursor:default}
  .tests{display:block!important}
  .file.open .tests{display:block}
  a{color:inherit}
}

/* signoff */
.signoff{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px}
@media(max-width:760px){.signoff{grid-template-columns:1fr}}
.so{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;text-align:center}
.so .r{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.so .n{font-weight:700;margin-top:4px}
.so .dt{color:var(--muted);font-size:12.5px;margin-top:2px}
.signline{position:relative;margin-top:22px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>

/* exec */
const R2=52,C=2*Math.PI*R2;

/* interactive results matrix */
const activeLayers=new Set();
const chips=document.getElementById('layerChips');
const layers=[...new Set(files.map(f=>f.layer))];
layers.forEach(l=>{const c=document.createElement('span');c.className='chip';c.textContent=l;
  c.onclick=()=>{activeLayers.has(l)?(activeLayers.delete(l),c.classList.remove('on')):(activeLayers.add(l),c.classList.add('on'));renderFiles();};
  chips.appendChild(c);});

function renderFiles(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const box=document.getElementById('files');box.innerHTML='';let shown=0;
  files.forEach(f=>{
    if(activeLayers.size&&!activeLayers.has(f.layer))return;
    const nm=f.name.toLowerCase().includes(q);
    const tm=f.tests.some(t=>t[0].toLowerCase().includes(q));
    if(q&&!nm&&!tm)return;
    shown++;
    const total=f.pass+f.fail, pp=total?Math.round(f.pass/total*100):0;
    const d=document.createElement('div');d.className='file';
    d.innerHTML=`<div class="fhead"><span class="chev">▶</span><span class="fname">${esc(f.name)}</span>
      <span class="flayer">${esc(f.layer)}</span><span class="mbar"><div style="width:${pp}%"></div></span>
      <span class="fcount">${f.pass}/${total} · ${pp}%</span></div>
      <div class="tests">${f.tests.map(([n,s])=>`<div class="tst"><span class="dot ${s}"></span><span>${esc(n)}</span></div>`).join('')}</div>`;
    d.querySelector('.fhead').onclick=()=>d.classList.toggle('open');
    box.appendChild(d);
  });
  document.getElementById('empty').style.display=shown?'none':'block';
  renderModuleBars(q);
}
function renderModuleBars(q){
  const box=document.getElementById('moduleBars');box.innerHTML='';
  files.filter(f=>!q||f.name.toLowerCase().includes(q)||f.tests.some(t=>t[0].toLowerCase().includes(q))).forEach(f=>{
    const total=f.pass+f.fail, pp=total?Math.round(f.pass/total*100):0;
    const d=document.createElement('div');d.className='fcard';
    d.innerHTML=`<div class="head"><span class="name">${esc(f.name)}</span><span class="layer">${esc(f.layer)}</span></div>
      <div class="bar"><div style="width:${pp}%"></div></div>
      <div class="fcount"><b>${f.pass}/${total}</b> passing · ${pp}%</div>`;
    box.appendChild(d);
  });
}
document.getElementById('q').addEventListener('input',renderFiles);
renderFiles();
