name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ══════════════════════════════════════════════════════════════
  # Tests
  # ══════════════════════════════════════════════════════════════
  test-node:
    name: Tests (Node · user-service, assessment-agent, learning-generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install test dependencies
        working-directory: test
        run: npm ci

      - name: Jest · user-service (unit/integration/performance)
        working-directory: test
        run: npx jest --silent user-service

      - name: Jest · assessment-agent (unit/integration/performance)
        working-directory: test
        run: npx jest --silent assessment-agent

      - name: node:test · learning-generator (unit/integration/performance)
        working-directory: test
        run: node --test --test-reporter=dot "learning-generator/**/*.test.js"

  test-python:
    name: Tests (Python · knowledge-analysis, peer-learning, ai-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/peer-learning/requirements.txt

      - name: Install service and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/knowledge-analysis/requirements.txt
          pip install -r services/peer-learning/requirements.txt
          pip install -r ai-engine/learning-generator/requirements.txt

      # Each service owns a top-level `app` package, so they must run as
      # separate pytest processes (collecting them together clashes).
      - name: pytest · knowledge-analysis
        run: python -m pytest test/knowledge-analysis -q

      - name: pytest · peer-learning
        run: python -m pytest test/peer-learning -q

      - name: pytest · ai-engine
        run: python -m pytest test/ai-engine -q

  # ══════════════════════════════════════════════════════════════
  # Build & Push images (pushed only on push to main)
  # ══════════════════════════════════════════════════════════════
  user-service:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push User Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/user service
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/user-service:${{ github.sha }}

  lmg-service:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push LMG Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/learning-generator
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lmg-service:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/lmg-service:${{ github.sha }}

  assessment-agent:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Assessment Agent
        uses: docker/build-push-action@v5
        with:
          context: ./services/assessment-agent
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/assessment-agent:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/assessment-agent:${{ github.sha }}

  knowledge-analysis:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Knowledge Analysis Agent
        uses: docker/build-push-action@v5
        with:
          context: ./services/knowledge-analysis
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/knowledge-analysis:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/knowledge-analysis:${{ github.sha }}

  peer-learning:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Peer Learning Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/peer-learning
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/peer-learning:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/peer-learning:${{ github.sha }}

  ai-engine:
    needs: [test-node, test-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push AI Engine
        uses: docker/build-push-action@v5
        with:
          context: ./ai-engine/learning-generator
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-engine:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ai-engine:${{ github.sha }}