services:
  # ── User Service ──
  user-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/user-service:latest
    container_name: mentora-user-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./services/user service/.env
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000,https://mentora.kaweesha.com

  # ── Learning Material Generator Service ──
  lmg-service:
    image: ghcr.io/${GITHUB_REPOSITORY}/lmg-service:latest
    container_name: mentora-lmg-service
    restart: unless-stopped
    ports:
      - "5012:3002"
    env_file:
      - ./services/learning-generator/.env
    environment:
      PORT: 3002
      CORS_ORIGIN: http://localhost:3000,https://mentora.kaweesha.com
    depends_on:
      - user-service

  # ── Assessment & Mastery Evaluation (AME) Agent ──
  assessment-agent:
    image: ghcr.io/${GITHUB_REPOSITORY}/assessment-agent:latest
    container_name: mentora-assessment-agent
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - ./services/assessment-agent/.env
    environment:
      PORT: 5002
      N8N_BASE_URL: http://n8n-container:5678
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      FRONTEND_URL: http://localhost:3000,https://mentora.kaweesha.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - user-service

  # ── Peer Learning Service ──
  peer-learning:
    image: ghcr.io/${GITHUB_REPOSITORY}/peer-learning:latest
    container_name: mentora-peer-learning
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./services/peer-learning/.env
    environment:
      PORT: 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Knowledge Analysis Agent (KAA) ──
  knowledge-analysis:
    image: ghcr.io/${GITHUB_REPOSITORY}/knowledge-analysis:latest
    container_name: mentora-knowledge-analysis
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ./services/knowledge-analysis/.env
    environment:
      USER_SERVICE_INTERNAL_URL: http://user-service:3001
      AI_ENGINE_URL: http://ai-engine:5010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - user-service
      - ai-engine

  # ── AI Engine ──
  ai-engine:
    image: ghcr.io/${GITHUB_REPOSITORY}/ai-engine:latest
    container_name: mentora-ai-engine
    restart: unless-stopped
    ports:
      - "5010:5010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      OLLAMA_CODE_MODEL: ${OLLAMA_CODE_MODEL:-qwen2.5-coder:7b}